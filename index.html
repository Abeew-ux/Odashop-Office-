<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODA Shop Office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--side:#fff;--card:#fff;--card2:#f0f1f4;--line:#e3e5ea;--txt:#16181d;--mut:#6b7280;--g:#d9961a;--gt:#fff;--ok:#16a34a;--bad:#dc2626;--sh:0 1px 3px #0001}
:root[data-theme=dark]{--bg:#0d0d0f;--side:#141416;--card:#161619;--card2:#1f1f23;--line:#2a2a2f;--txt:#f3f1ea;--mut:#9a9aa3;--g:#e8b23a;--gt:#111;--sh:none}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
#app{display:flex;min-height:100vh}
aside{width:224px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--g);color:var(--gt);font-weight:900;font-size:9px;line-height:1;display:grid;place-items:center;text-align:center}
.brand b{display:block;font-size:15px}.brand small{color:var(--g);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:600;text-align:left;width:100%}
.nv:hover{background:var(--card2)}
.nv.on{background:var(--g);color:var(--gt)}
.nv i{font-style:normal;width:20px;text-align:center}
.nv .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nv.on .dot{background:#fff;color:var(--bad)}
.spacer{flex:1}
main{flex:1;min-width:0;padding:24px 32px 60px;max-width:1280px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar h1{font-size:24px;letter-spacing:-.5px;margin-right:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{cursor:pointer}.kpi b{display:block;font-size:30px;color:var(--g);line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.kpi:hover{border-color:var(--g)}
.btn{background:var(--g);color:var(--gt);font-weight:700;border-radius:10px;padding:9px 16px;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.o{background:none;border:1px solid var(--line);color:var(--txt)}
.btn.o:hover{border-color:var(--g)}
.btn.d{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.s{padding:6px 11px;font-size:13px}
.btn.full{width:100%;text-align:center;margin-top:12px}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;margin-top:5px}
.fld:focus{border-color:var(--g)}
.srch{max-width:280px;margin:0}
label{display:block;font-size:12px;color:var(--mut);margin-top:12px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:13px}
.tab.on{background:var(--g);color:var(--gt);border-color:var(--g)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:11px 14px;background:var(--card2)}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--card2)}
.r{text-align:right}
.mut,small{color:var(--mut);font-size:12.5px}
.price{color:var(--g);font-weight:800;white-space:nowrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#d9961a22;color:var(--g);white-space:nowrap}
.badge.ok{background:#16a34a22;color:var(--ok)}.badge.bad{background:#dc262622;color:var(--bad)}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-of-type{border-top:0}
.tg{width:42px;height:24px;border-radius:99px;background:#9994;position:relative;transition:.2s;flex-shrink:0;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--g)}.tg.on::after{left:21px}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
#ov{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#ov.show{display:flex}
#dlg{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 24px;position:relative}
#dlg h3{font-size:20px;margin-bottom:2px;padding-right:30px}
#x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--card2);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#16181d;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{max-width:380px;margin:12vh auto;padding:30px;text-align:center}
.login .logo{width:60px;height:60px;font-size:13px;margin:0 auto 14px;border-radius:16px}
.err{color:var(--bad);margin-top:10px;min-height:18px}
.chat{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 130px);min-height:420px}
.chat>div{overflow:auto}
.th{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.th:hover,.th.on{background:var(--card2)}
.bub{max-width:75%;padding:9px 14px;border-radius:16px;margin-bottom:8px;white-space:pre-wrap}
.bub.me{margin-left:auto;background:var(--g);color:var(--gt);border-bottom-right-radius:4px}
.bub.ot{background:var(--card2);border-bottom-left-radius:4px}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.sc .card{cursor:pointer;padding:0;overflow:hidden}.sc .card:hover{border-color:var(--g)}
.sc .pic{height:110px;background:var(--card2);display:grid;place-items:center;font-size:38px}
.sc .pic img{width:100%;height:100%;object-fit:cover}
.sc .bd{padding:12px}
@media(max-width:800px){
 #app{flex-direction:column}
 aside{width:100%;height:auto;position:sticky;z-index:20;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
 .brand,.spacer{display:none}
 .nv{width:auto;white-space:nowrap;padding:8px 12px}
 main{padding:16px 14px 50px}
 .chat{grid-template-columns:1fr;height:auto}
 table{display:block;overflow-x:auto}
 .two{grid-template-columns:1fr}
 #ov{align-items:flex-end;padding:0}#dlg{border-radius:18px 18px 0 0;max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div id="dlg"></div></div><div class="toast" id="toast"></div>
<script>
const SB_URL="https://zssyuerclbjydkuooukk.supabase.co";
const SB_KEY="sb_publishable_8JxMf66gzM7B9idXFtTSEg_ddXevxEf";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"oda-office-auth",persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("fr-FR").replace(/ | /g," ")+" F";
const dt=d=>new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const STAT={nouvelle:"Nouvelle",confirmee:"Confirmée",en_livraison:"En livraison",livree:"Livrée",annulee:"Annulée"};
const SH={en_attente:"En attente",approuvee:"Approuvée",refusee:"Refusée",suspendue:"Suspendue"};
const bcls=s=>["livree","approuvee","approuve"].includes(s)?"ok":["annulee","refusee","suspendue","refuse"].includes(s)?"bad":"";
let S={videos:[],tab:"home",orders:[],products:[],messages:[],services:[],items:[],cities:[],settings:{},shops:[],customers:[],banners:[],ofilter:"all",pfilter:"all",sfilter:"all",vtab:"svc",q:"",thread:null,unread:0};
try{const t=localStorage.getItem("oda_office_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
function toggleTheme(){const d=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=d;try{localStorage.setItem("oda_office_theme",d)}catch(e){}}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function dlg(h){$("#dlg").innerHTML='<button id="x" aria-label="Fermer">✕</button>'+h;$("#ov").classList.add("show");$("#x").onclick=closeDlg}
function closeDlg(){$("#ov").classList.remove("show")}
$("#ov").onmousedown=e=>{if(e.target.id=="ov")closeDlg()};
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeDlg()});
async function run(p,ok){const {error}=await p;if(error){toast("Erreur : "+error.message);return false}if(ok)toast(ok);return true}
function tgl(id,get,set){$(id).onclick=e=>{set(!get());e.currentTarget.classList.toggle("on",get())}}

/* photo (Telegram) */
function photoBox(st,hint,w,h){return `<div class="row"><div class="thumb" id="pv" style="width:${w||72}px;height:${h||72}px">${st.img?`<img src="${esc(st.img)}">`:"📷"}</div><div class="sp"><input type="file" id="fi" accept="image/*" hidden><button class="btn o s" id="pick" type="button">Choisir une photo</button><div class="mut" id="up" style="margin-top:4px">${hint||""}</div></div></div>`}
function bindPhoto(st){
  $("#pick").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;$("#up").textContent="Envoi sur Telegram…";
    try{
      const {data:{session}}=await sb.auth.getSession();
      const fd=new FormData();fd.append("file",f);
      const r=await fetch(SB_URL+"/functions/v1/tg-upload",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:SB_KEY},body:fd});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.file_id){$("#up").textContent="Erreur : "+(j.error||r.status);return}
      st.fid=j.file_id;st.img=SB_URL+"/functions/v1/tg-image?id="+encodeURIComponent(j.file_id);
      $("#pv").innerHTML=`<img src="${URL.createObjectURL(f)}">`;$("#up").textContent="Photo envoyée ✓ (pense à enregistrer)";
    }catch(err){$("#up").textContent="Erreur réseau, réessayez"}
  };
}

/* ---------- Connexion ---------- */
function loginView(msg=""){
  $("#app").innerHTML=`<div class="login card" style="margin-top:12vh"><div class="logo">ODA<br>SHOP</div><h1 style="font-size:22px">ODA Shop Office</h1><p class="mut" style="margin:4px 0 16px">Espace de gestion</p>
  <input class="fld" id="em" type="email" placeholder="Email" autocomplete="username">
  <input class="fld" id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button class="btn full" id="go">Se connecter</button><div class="err" id="er">${esc(msg)}</div></div>`;
  const go=async()=>{
    $("#er").textContent="";$("#go").textContent="Connexion…";
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    $("#go").textContent="Se connecter";
    if(error){$("#er").textContent="Email ou mot de passe incorrect.";return}
    start();
  };
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key=="Enter")go()};$("#em").onkeydown=e=>{if(e.key=="Enter")$("#pw").focus()};
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const {data}=await sb.from("admins").select("user_id").eq("user_id",session.user.id);
  if(!data||!data.length){await sb.auth.signOut();return loginView("Ce compte n'a pas accès au Office.")}
  S.email=session.user.email;
  shell();await loadAll();render();
  clearInterval(window._t);window._t=setInterval(()=>{if(!$("#ov.show")&&!($("#mb")&&$("#mb").value)&&document.activeElement.tagName!="INPUT")refresh()},30000);
}

/* ---------- Données ---------- */
async function loadAll(){
  const [o,p,m,s,i,c,st,sh,cu,bn,vd]=await Promise.all([
    sb.from("orders").select("*").order("created_at",{ascending:false}).limit(300),
    sb.from("products").select("*").order("created_at",{ascending:false}),
    sb.from("messages").select("*").order("created_at",{ascending:true}).limit(1000),
    sb.from("services").select("*").order("sort_order"),
    sb.from("service_items").select("*").order("sort_order"),
    sb.from("cities").select("*").order("sort_order"),
    sb.from("settings").select("*"),
    sb.from("shops").select("*").order("created_at",{ascending:false}),
    sb.from("customers").select("id,name,phone"),
    sb.from("banners").select("*").order("sort_order"),
    sb.from("videos").select("*").order("created_at",{ascending:false}).limit(200)]);
  S.videos=vd.data||[];
  S.shops=sh.data||[];S.customers=cu.data||[];S.banners=bn.data||[];
  S.orders=o.data||[];S.products=p.data||[];S.messages=m.data||[];S.services=s.data||[];S.items=i.data||[];S.cities=c.data||[];
  S.settings=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value]));
  S.unread=S.messages.filter(x=>x.sender=="client"&&!x.is_read).length;
}
async function refresh(){await loadAll();render()}

/* ---------- Structure ---------- */
const NAV=[["home","🏠","Accueil"],["orders","🧾","Commandes"],["products","🛍️","Produits"],["shops","🏪","Boutiques"],["videos","🎬","Vidéos"],["msgs","💬","Messages"],["vit","🎨","Vitrine"],["set","⚙️","Réglages"]];
const nNew=()=>S.orders.filter(o=>o.status=="nouvelle").length;
const pP=()=>S.products.filter(p=>p.status=="en_attente").length;
const pV=()=>S.videos.filter(v=>v.status=="en_attente").length;
const pS=()=>S.shops.filter(s=>s.status=="en_attente").length;
function shell(){
  $("#app").innerHTML=`<aside><div class="brand"><div class="logo">ODA<br>SHOP</div><div><small>Office</small><b>ODA Shop</b></div></div>
  ${NAV.map(n=>`<button class="nv" data-t="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join("")}
  <div class="spacer"></div>
  <button class="nv" id="th"><i>🌓</i>Thème</button><button class="nv" id="rf"><i>⟳</i>Actualiser</button></aside><main id="view"></main>`;
  $("#rf").onclick=async()=>{await refresh();toast("Actualisé")};
  $("#th").onclick=toggleTheme;
  document.querySelectorAll(".nv[data-t]").forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t,opt={}){S.tab=t;S.thread=opt.thread||null;S.q="";if(opt.of)S.ofilter=opt.of;if(opt.pf)S.pfilter=opt.pf;if(opt.sf)S.sfilter=opt.sf;render();scrollTo(0,0)}
function render(){
  const bd={orders:nNew(),products:pP(),shops:pS(),videos:pV(),msgs:S.unread};
  document.querySelectorAll(".nv[data-t]").forEach(b=>{b.classList.toggle("on",b.dataset.t==S.tab);const d=b.querySelector(".dot");if(d)d.remove();const n=bd[b.dataset.t];if(n>0)b.insertAdjacentHTML("beforeend",`<span class="dot">${n}</span>`)});
  ({home:vHome,orders:vOrders,products:vProducts,shops:vShops,videos:vVideos,msgs:vMsgs,vit:vVit,set:vSet})[S.tab]();
}
function searchBox(ph){return `<input class="fld srch" id="q" placeholder="${ph}" value="${esc(S.q)}">`}
function bindSearch(fn){const q=$("#q");q.oninput=()=>{S.q=q.value;const p=q.selectionStart;fn();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
function tabs(list,cur,attr){return `<div class="tabs">${list.map(([k,v])=>`<button class="tab ${cur==k?"on":""}" data-${attr}="${k}">${v}</button>`).join("")}</div>`}

/* ---------- Accueil ---------- */
function vHome(){
  const today=new Date().toDateString();
  const td=S.orders.filter(o=>new Date(o.created_at).toDateString()==today&&o.status!="annulee");
  const news=S.orders.filter(o=>o.status=="nouvelle").slice(0,5);
  const pp=S.products.filter(p=>p.status=="en_attente").slice(0,5);
  const sp=S.shops.filter(s=>s.status=="en_attente").slice(0,5);
  const pvd=S.videos.filter(v=>v.status=="en_attente").slice(0,5);
  const un=threads().filter(t=>t.msgs.some(y=>y.sender=="client"&&!y.is_read)).slice(0,5);
  const none=!pvd.length&&!news.length&&!pp.length&&!sp.length&&!un.length;
  $("#view").innerHTML=`<div class="bar"><h1>Bonjour 👋</h1><span class="mut">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</span></div>
  <div class="grid g4" style="margin-bottom:18px">
   <div class="card kpi" data-go="orders" data-of="nouvelle"><b>${nNew()}</b><span>Nouvelles commandes</span></div>
   <div class="card kpi" data-go="products" data-pf="pending"><b>${pP()}</b><span>Produits à valider</span></div>
   <div class="card kpi" data-go="msgs"><b>${S.unread}</b><span>Messages non lus</span></div>
   <div class="card kpi" data-go="orders"><b>${money(td.reduce((a,o)=>a+o.total,0))}</b><span>${td.length} commande(s) aujourd'hui</span></div>
  </div>
  <div class="card"><h3 style="margin-bottom:6px">À faire</h3>
  ${none?'<div class="empty" style="padding:24px">✅ Rien en attente. Tout est à jour.</div>':""}
  ${news.map(o=>`<div class="todo" data-o="${o.id}"><span class="badge">Commande</span><div class="sp"><b>#${o.id} · ${esc(o.customer_name)}</b> <small>${esc(o.city)} · ${dt(o.created_at)}</small></div><span class="price">${money(o.total)}</span></div>`).join("")}
  ${pp.map(p=>`<div class="todo" data-p="${p.id}"><span class="badge">Produit</span><div class="sp"><b>${esc(p.name)}</b> <small>${esc(shopName(p.shop_id))}</small></div><span class="price">${money(p.price)}</span></div>`).join("")}
  ${sp.map(s=>`<div class="todo" data-s="${s.id}"><span class="badge">Boutique</span><div class="sp"><b>${esc(s.name)}</b> <small>${esc(s.city||"")}</small></div></div>`).join("")}
  ${pvd.map(v=>`<div class="todo" data-vd="${v.id}"><span class="badge">Vidéo</span><div class="sp"><b>${esc(v.shop_name||"")}</b> <small>${esc((v.caption||"").slice(0,50))}</small></div></div>`).join("")}
  ${un.map(t=>`<div class="todo" data-k="${esc(t.k)}"><span class="badge">Message</span><div class="sp"><b>${esc(t.name)}</b> <small>${esc(t.msgs.at(-1).body.slice(0,60))}</small></div></div>`).join("")}
  </div>`;
  document.querySelectorAll("[data-go]").forEach(c=>c.onclick=()=>go(c.dataset.go,{of:c.dataset.of,pf:c.dataset.pf}));
  document.querySelectorAll("[data-o]").forEach(c=>c.onclick=()=>orderDlg(+c.dataset.o));
  document.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>productDlg(c.dataset.p));
  document.querySelectorAll("[data-s]").forEach(c=>c.onclick=()=>shopDlg(c.dataset.s));
  document.querySelectorAll("[data-vd]").forEach(c=>c.onclick=()=>videoDlg(c.dataset.vd));
  document.querySelectorAll("[data-k]").forEach(c=>c.onclick=()=>go("msgs",{thread:c.dataset.k}));
}

/* ---------- Commandes ---------- */
function vOrders(){
  const q=S.q.toLowerCase();
  const list=S.orders.filter(o=>(S.ofilter=="all"||o.status==S.ofilter)&&(!q||[o.id,o.customer_name,o.customer_phone,o.city,o.kind].join(" ").toLowerCase().includes(q)));
  $("#view").innerHTML=`<div class="bar"><h1>Commandes</h1>${searchBox("Rechercher (nom, tél, n°…)")}</div>
  ${tabs([["all","Toutes"],...Object.entries(STAT)],S.ofilter,"f")}

/* ---------- Messages (2 colonnes) ---------- */
function threads(){
  const m=new Map();
  S.messages.forEach(x=>{const k=x.customer_id||x.client_key||x.customer_phone||x.customer_name||"?";if(!m.has(k))m.set(k,{k,name:x.customer_name||x.customer_phone||"Client",phone:x.customer_phone,cid:x.customer_id,ck:x.client_key,msgs:[]});const t=m.get(k);if(x.sender=="client"){t.name=x.customer_name||t.name;t.phone=x.customer_phone||t.phone}t.msgs.push(x)});
  return [...m.values()].sort((a,b)=>new Date(b.msgs.at(-1).created_at)-new Date(a.msgs.at(-1).created_at));
}
function vMsgs(){
  const t=threads();
  if(!S.thread&&t.length&&innerWidth>800)S.thread=String(t[0].k);
  const th=t.find(x=>String(x.k)==S.thread);
  $("#view").innerHTML=`<div class="bar"><h1>Messages</h1><span class="mut">Les messages de plus de 7 jours sont supprimés automatiquement</span></div>
  ${t.length?`<div class="chat"><div class="card" style="padding:0">${t.map(x=>{const last=x.msgs.at(-1),un=x.msgs.filter(y=>y.sender=="client"&&!y.is_read).length;return `<div class="th ${String(x.k)==S.thread?"on":""}" data-k="${esc(x.k)}"><div class="thumb" style="border-radius:50%">👤</div><div class="sp"><b>${esc(x.name)}</b><br><small>${esc(last.body.slice(0,40))}</small></div>${un?`<span class="badge" style="background:var(--g);color:var(--gt)">${un}</span>`:""}</div>`}).join("")}</div>
  <div class="card" style="display:flex;flex-direction:column;padding:0">${th?`<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line)"><b class="sp">${esc(th.name)} <small>${esc(th.phone||"")}</small></b>${th.phone?`<a class="btn o s" target="_blank" rel="noopener" href="https://wa.me/${String(th.phone).replace(/\D/g,"")}">WhatsApp</a>`:""}</div>
  <div id="msgs" style="flex:1;overflow:auto;padding:16px">${th.msgs.map(x=>`<div class="bub ${x.sender=="admin"?"me":"ot"}">${esc(x.body)}<br><small style="opacity:.7">${dt(x.created_at)}</small></div>`).join("")}</div>
  <div class="row" style="padding:12px;border-top:1px solid var(--line)"><input class="fld" id="mb" style="margin:0" placeholder="Votre réponse… (Entrée pour envoyer)"><button class="btn" id="sd">Envoyer</button></div>`:'<div class="empty">Choisissez une conversation</div>'}</div></div>`:'<div class="empty">Aucun message pour le moment.</div>'}`;
  document.querySelectorAll("[data-k]").forEach(c=>c.onclick=()=>{S.thread=c.dataset.k;vMsgs()});
  if(!th)return;
  const box=$("#msgs");if(box)box.scrollTop=box.scrollHeight;
  const send=async()=>{const b=$("#mb").value.trim();if(!b)return;
    if(await run(sb.from("messages").insert({client_key:th.ck||null,customer_id:th.cid,customer_name:th.name,customer_phone:th.phone,sender:"admin",body:b,is_read:true}))){$("#mb").value="";await refresh()}};
  $("#sd").onclick=send;$("#mb").onkeydown=e=>{if(e.key=="Enter")send()};
  const ids=th.msgs.filter(x=>x.sender=="client"&&!x.is_read).map(x=>x.id);
  if(ids.length)sb.from("messages").update({is_read:true}).in("id",ids).then(()=>{ids.forEach(i=>{const m=S.messages.find(m=>m.id==i);if(m)m.is_read=true});S.unread=S.messages.filter(x=>x.sender=="client"&&!x.is_read).length;const d=document.querySelector('.nv[data-t=msgs] .dot');if(d){S.unread?d.textContent=S.unread:d.remove()}});
}

  <div class="two"><div><label>Ouvre quelle page ?</label><select class="fld" id="tg"><option value="">Aucune</option>${S.services.map(s=>`<option value="${esc(s.slug)}" ${b.target==s.slug?"selected":""}>${esc(s.title)}</option>`).join("")}</select></div><div><label>Ordre</label><input class="fld" id="so" type="number" value="${b.sort_order||0}"></div></div>
  <div class="sw"><span>Visible dans l'appli</span><div class="tg ${active?"on":""}" id="ac"></div></div>
  <div class="row" style="margin-top:16px;gap:8px"><button class="btn" id="sv">Enregistrer</button>${id?'<button class="btn d" id="dl">Supprimer</button>':""}</div>`);
  tgl("#ac",()=>active,v=>active=v);bindPhoto(ph);
  $("#sv").onclick=async()=>{
    const row={title:$("#t").value.trim(),subtitle:$("#s").value.trim()||null,emoji:$("#e").value.trim()||null,button:$("#bt").value.trim()||null,target:$("#tg").value||null,sort_order:+$("#so").value||0,image_url:ph.img||null,telegram_file_id:ph.fid,active};
    if(!row.title)return toast("Entrez un titre");
    if(await run(id?sb.from("banners").update(row).eq("id",id):sb.from("banners").insert(row),"Bannière enregistrée")){closeDlg();refresh()}};
  if(id)$("#dl").onclick=async()=>{if(confirm("Supprimer cette bannière ?")&&await run(sb.from("banners").delete().eq("id",id),"Supprimée")){closeDlg();refresh()}};
}
function newServiceDlg(){
  dlg(`<h3>Nouveau service</h3>
  <label>Titre</label><input class="fld" id="t" placeholder="Ex : Salon de coiffure">
  <label>Description</label><input class="fld" id="d" placeholder="Ex : Coiffure et soins à domicile">
  <div class="two"><div><label>Icône (emoji)</label><input class="fld" id="ic" placeholder="💈"></div><div><label>Texte du bouton</label><input class="fld" id="cta" value="Commander"></div></div>
  <button class="btn full" id="sv">Créer le service</button>`);
  $("#sv").onclick=async()=>{
    const title=$("#t").value.trim();if(!title)return toast("Entrez un titre");
    const next=Math.max(0,...S.services.map(x=>x.sort_order||0))+1;
    if(await run(sb.from("services").insert({slug:"s"+Date.now().toString(36),label:"Service",title,subtitle:$("#d").value.trim(),icon:$("#ic").value.trim()||"🧰",cta:$("#cta").value.trim()||"Commander",sort_order:next}),"Service créé")){await loadAll();render();const n=S.services.at(-1);n?serviceDlg(n.id):closeDlg()}};
}
function serviceDlg(id){
  const s=S.services.find(x=>x.id==id);if(!s)return;let active=s.active;const ph={img:s.image_url||"",fid:s.telegram_file_id||null};
  const its=S.items.filter(i=>i.service_id==id);
  dlg(`<h3>${esc(s.icon||"")} ${esc(s.title)}</h3><div style="margin-top:10px">${photoBox(ph,"Affichée dans le carré de l'appli")}</div>
  <label>Titre</label><input class="fld" id="t" value="${esc(s.title)}">
  <div class="two"><div><label>Description</label><input class="fld" id="d" value="${esc(s.subtitle||"")}"></div><div><label>Icône (emoji)</label><input class="fld" id="ic" value="${esc(s.icon||"")}"></div></div>
  <div class="sw"><span>Visible dans l'appli</span><div class="tg ${active?"on":""}" id="ac"></div></div>
  <div class="row" style="margin-top:14px;gap:8px"><button class="btn" id="sv">Enregistrer</button>${["neuf","occasion"].includes(s.slug)?"":'<button class="btn d" id="dsv">Supprimer</button>'}</div>
  <h3 style="margin-top:22px;font-size:16px">Produits du service</h3>
  ${its.map(i=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div class="thumb">${i.image_url?`<img src="${esc(i.image_url)}">`:"📦"}</div><div class="sp"><b>${esc(i.name)}</b><br><small>${esc(i.description||"")}${i.price?" · "+money(i.price):" · Sur devis"}</small></div><button class="btn o s" data-e="${i.id}">Modifier</button></div>`).join("")||'<p class="mut" style="margin-top:6px">Aucun produit.</p>'}
  <button class="btn o full" id="ai">+ Ajouter un produit à ce service</button>`);
  tgl("#ac",()=>active,v=>active=v);bindPhoto(ph);
  $("#sv").onclick=async()=>{if(await run(sb.from("services").update({title:$("#t").value.trim(),subtitle:$("#d").value.trim(),icon:$("#ic").value.trim(),active,image_url:ph.img||null,telegram_file_id:ph.fid}).eq("id",id),"Service enregistré")){closeDlg();refresh()}};
  $("#ai").onclick=()=>itemDlg(id);
  if($("#dsv"))$("#dsv").onclick=async()=>{if(confirm("Supprimer ce service et tous ses produits ?")&&await run(sb.from("services").delete().eq("id",id),"Service supprimé")){closeDlg();refresh()}};
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>itemDlg(id,+b.dataset.e));
}
function itemDlg(sid,iid){
  const i=iid?S.items.find(x=>x.id==iid):{name:"",description:"",price:0,image_url:"",telegram_file_id:null};
  const ph={img:i.image_url||"",fid:i.telegram_file_id||null};
  dlg(`<h3>${iid?"Modifier":"Nouveau"} produit du service</h3><div style="margin-top:10px">${photoBox(ph)}</div>
  <label>Nom</label><input class="fld" id="n" value="${esc(i.name)}">
  <label>Description</label><input class="fld" id="d" value="${esc(i.description||"")}">
  <label>Prix (F) — 0 pour « Sur devis »</label><input class="fld" id="pr" type="number" value="${i.price||0}">
  <div class="row" style="margin-top:16px;gap:8px"><button class="btn" id="sv">Enregistrer</button>${iid?'<button class="btn d" id="dl">Supprimer</button>':""}<button class="btn o" id="bk">Retour</button></div>`);
  bindPhoto(ph);$("#bk").onclick=()=>serviceDlg(sid);
  $("#sv").onclick=async()=>{const r={name:$("#n").value.trim(),description:$("#d").value.trim(),price:Math.max(0,+$("#pr").value||0),image_url:ph.img||null,telegram_file_id:ph.fid,service_id:sid};if(!r.name)return toast("Entrez un nom");
    if(await run(iid?sb.from("service_items").update(r).eq("id",iid):sb.from("service_items").insert(r),"Enregistré")){await loadAll();render();serviceDlg(sid)}};
  if(iid)$("#dl").onclick=async()=>{if(confirm("Supprimer ?")&&await run(sb.from("service_items").delete().eq("id",iid),"Supprimé")){await loadAll();render();serviceDlg(sid)}};
}

/* ---------- Réglages ---------- */
function vSet(){
  $("#view").innerHTML=`<div class="bar"><h1>Réglages</h1></div><div class="grid g2">
  <div class="card"><h3>Boutique</h3>
   <label>Numéro WhatsApp (format international, sans +)</label><input class="fld" id="wa" inputmode="tel" placeholder="227XXXXXXXX" value="${esc(S.settings.whatsapp_number||"")}">
   <label>Titre de l'accueil</label><input class="fld" id="ht" value="${esc(S.settings.hero_title||"")}">
   <button class="btn full" id="ss">Enregistrer</button></div>
  <div class="card"><h3>Mon compte</h3><p class="mut">${esc(S.email)}</p>
   <label>Nouveau mot de passe</label><input class="fld" id="np" type="password" autocomplete="new-password" placeholder="8 caractères minimum">
   <div class="row" style="margin-top:12px;gap:8px"><button class="btn o" id="cp">Changer</button><button class="btn d" id="lo">Se déconnecter</button></div></div>
  <div class="card"><div class="row"><h3 class="sp">Villes de livraison</h3><button class="btn s" id="ac">+ Ville</button></div>
   ${S.cities.map(c=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line);${c.active?"":"opacity:.5"}"><div class="sp"><b>${esc(c.name)}</b> <small>Frais : ${money(c.delivery_fee)}</small></div><button class="btn o s" data-c="${c.id}">Modifier</button></div>`).join("")}</div>
  <div class="card"><h3>Telegram</h3><p class="mut" style="margin-top:6px">Les photos sont stockées sur Telegram. Les nouvelles commandes, messages, boutiques et produits à valider sont envoyés dans le groupe Telegram.</p></div></div>`;
  $("#ss").onclick=async()=>{const ok=await run(sb.from("settings").upsert([{key:"whatsapp_number",value:$("#wa").value.replace(/\D/g,""),is_public:true},{key:"hero_title",value:$("#ht").value.trim(),is_public:true}]),"Réglages enregistrés");if(ok)refresh()};
  $("#cp").onclick=async()=>{const v=$("#np").value;if(v.length<8)return toast("8 caractères minimum");if(await run(sb.auth.updateUser({password:v}),"Mot de passe changé"))$("#np").value=""};
  $("#lo").onclick=async()=>{clearInterval(window._t);await sb.auth.signOut();loginView()};
  $("#ac").onclick=()=>cityDlg();
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>cityDlg(+b.dataset.c));
}
function cityDlg(id){
  const c=id?S.cities.find(x=>x.id==id):{name:"",delivery_fee:0,active:true};let active=c.active;
  dlg(`<h3>${id?"Modifier":"Nouvelle"} ville</h3><label>Nom</label><input class="fld" id="n" value="${esc(c.name)}">
  <label>Frais de livraison (F)</label><input class="fld" id="f" type="number" value="${c.delivery_fee}">
  <div class="sw"><span>Active</span><div class="tg ${active?"on":""}" id="ac2"></div></div>
  <div class="row" style="margin-top:16px;gap:8px"><button class="btn" id="sv">Enregistrer</button>${id?'<button class="btn d" id="dl">Supprimer</button>':""}</div>`);
  tgl("#ac2",()=>active,v=>active=v);
  $("#sv").onclick=async()=>{const r={name:$("#n").value.trim(),delivery_fee:+$("#f").value||0,active};if(!r.name)return toast("Entrez un nom");
    if(await run(id?sb.from("cities").update(r).eq("id",id):sb.from("cities").insert(r),"Ville enregistrée")){closeDlg();refresh()}};
  if(id)$("#dl").onclick=async()=>{if(confirm("Supprimer cette ville ?")&&await run(sb.from("cities").delete().eq("id",id),"Supprimée")){closeDlg();refresh()}};
}
start();
</script>
</body>
</html>
